    <title>Academic Experiment Design</title>
    <style>
      @keyframes glow-pulse {
        0%   { text-shadow: none; }
        30%  { text-shadow: 0 0 6px var(--glow-c), 0 0 14px var(--glow-c), 0 0 28px var(--glow-c); }
        60%  { text-shadow: 0 0 4px var(--glow-c), 0 0 10px var(--glow-c); }
        100% { text-shadow: none; }
      }
      @keyframes glow-ring {
        0%   { box-shadow: 0 0 0 0 rgba(246, 224, 94, 0); }
        35%  { box-shadow: 0 0 0 3px rgba(246, 224, 94, 0.6), 0 0 12px 3px rgba(246, 224, 94, 0.5); }
        100% { box-shadow: 0 0 0 0 rgba(246, 224, 94, 0); }
      }
