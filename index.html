<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Experiment Design</title>
    <style>
      @keyframes glow-pulse {
        0%   { text-shadow: none; }
        30%  { text-shadow: 0 0 6px var(--glow-c), 0 0 14px var(--glow-c), 0 0 28px var(--glow-c); }
        60%  { text-shadow: 0 0 4px var(--glow-c), 0 0 10px var(--glow-c); }
        100% { text-shadow: none; }
      }
      @keyframes glow-ring {
        0%   { box-shadow: 0 0 0 0 rgba(246, 224, 94, 0); }
        35%  { box-shadow: 0 0 0 3px rgba(246, 224, 94, 0.6), 0 0 12px 3px rgba(246, 224, 94, 0.5); }
        100% { box-shadow: 0 0 0 0 rgba(246, 224, 94, 0); }
      }

      /*
       * goal-beacon — the slow breathing halo on the "Main study" marker at the end of the
       * progress bar. It marks the destination the participant is working towards, so unlike
       * glow-pulse / glow-ring (which are one-shot "this just changed" signals) it loops.
       * Kept deliberately slow and low-amplitude: it sits in a sticky header for the whole
       * session and must read as ambient, never as an alert.
       *
       * Defined here rather than in a component for the same reason as the two above: Chakra's
       * css-in-js pipeline can mangle keyframe bodies.
       */
      @keyframes goal-beacon {
        0%, 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.45), 0 0 10px 1px rgba(168, 85, 247, 0.25); }
        50%      { box-shadow: 0 0 0 7px rgba(168, 85, 247, 0),  0 0 20px 5px rgba(168, 85, 247, 0.45); }
      }
      .vrds-goal-beacon { animation: goal-beacon 3.2s ease-in-out infinite; }

      /*
       * hint-breathe — a slow invitation on a control the participant has not discovered yet.
       *
       * Two things separate it from glow-ring. It is SLOW (the beacon's 3.2s rather than 1.6s),
       * because a fast pulse reads as an alert — something is wrong, act now — and this is an
       * invitation to look. And it takes its color from --hint-c, the way glow-pulse takes
       * --glow-c, so it can wear whichever accent the current scenario is using instead of a
       * hardcoded yellow.
       *
       * Unlike the beacon it is not ambient: every place it is used removes it as soon as the
       * participant has used the control once. See OptionCard.
       */
      @keyframes hint-breathe {
        0%, 100% { box-shadow: 0 0 0 0 var(--hint-c), 0 0 0 0 transparent; }
        50%      { box-shadow: 0 0 0 4px transparent, 0 0 12px 2px var(--hint-c); }
      }
      .vrds-hint-breathe { animation: hint-breathe 3.2s ease-in-out infinite; }

      /*
       * Participants who have asked their OS for less motion get the emphasis without the
       * movement — a steady ring instead of a pulsing one. This covers every looping glow in
       * the app, not just the beacon: glow-ring drives three controls inside Block 5, and those
       * were still pulsing for people who had explicitly asked them not to.
       */
      @media (prefers-reduced-motion: reduce) {
        .vrds-goal-beacon {
          animation: none;
          box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3), 0 0 14px 2px rgba(168, 85, 247, 0.3);
        }
        .vrds-hint-breathe {
          animation: none;
          box-shadow: 0 0 0 2px var(--hint-c);
        }
        /* Carried by every control that runs glow-ring on a loop; Chakra compiles the animation
           prop to a class of its own, so there is nothing else stable to select on. */
        .vrds-glow-ring {
          animation: none !important;
          box-shadow: 0 0 0 2px rgba(246, 224, 94, 0.45);
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
